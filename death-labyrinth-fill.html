<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>死亡大迷宮 探索圖樣補完</title>
<style>
:root{--bg:#16151c;--panel:#201f29;--panel2:#2a2934;--line:#34323f;--txt:#e9e6f2;--mut:#9a96ab;--acc:#f2c14e;
--floor:#8d88a3;--wall:#3b3848;--unk:#0d0c11;--E:#2f6b5e;--H:#8a3d63;--B:#8c3b36;--C:#b07a12;--K:#6a5694;--D:#3a5b86}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,"PingFang TC","Noto Sans TC",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 8px}
button,textarea{font:inherit;color:var(--txt)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}button.on{background:var(--acc);color:#1b1a20;border-color:var(--acc);font-weight:700}
button.danger{color:#f08a7a}
.tabs{display:flex;flex-wrap:wrap;gap:6px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}
.tabs button small{opacity:.8;font-weight:400}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools button{display:flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:4px;display:inline-block}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media(max-width:820px){.main{grid-template-columns:1fr}}
.grid{display:grid;gap:2px;touch-action:none;user-select:none;margin:0 auto}
.c{aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;position:relative;cursor:crosshair;font-size:clamp(9px,2.4vw,15px)}
.c.f{background:var(--floor)}.c.w{background:var(--wall)}.c.u{background:var(--unk);outline:1px dashed #4a4858;outline-offset:-2px;color:#5d5a6e}
.c.E{background:var(--E)}.c.H{background:var(--H)}.c.B{background:var(--B)}.c.C{background:var(--C)}.c.K{background:var(--K)}.c.D{background:var(--D)}
.c.chg::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.coord{color:var(--mut);font-size:11px;display:flex;align-items:center;justify-content:center}
.orig{position:relative}.orig img{width:100%;display:block;border-radius:6px}
.orig svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.stat span{background:var(--panel2);border-radius:6px;padding:2px 8px;font-size:13px}
.note{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea{width:100%;min-height:140px;background:#14131a;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
a{color:var(--acc)}
label.ck{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
</style></head><body><div class="wrap">
<h1>死亡大迷宮・探索圖樣補完</h1>
<p class="sub">底圖是貓娘冒險誌上 7 張探索圖樣的判讀結果，黑色虛線格是網站上還沒人探索的區域。進遊戲探索後，選上面的顏色，點或拖曳格子把它補上。你改過的格子右上角會有黃點。資料存在這台裝置的瀏覽器裡。</p>

<div class="tabs" id="tabs"></div>

<div class="card">
<div class="tools" id="tools">
<button data-t="." class="on"><i class="sw" style="background:var(--floor)"></i>路</button>
<button data-t="#"><i class="sw" style="background:var(--wall)"></i>牆</button>
<button data-t="~"><i class="sw" style="background:var(--unk);outline:1px dashed #555"></i>未探索</button>
<button data-t="E"><i class="sw" style="background:var(--E)"></i>E 入口</button>
<button data-t="B"><i class="sw" style="background:var(--B)"></i>B 頭目</button>
<button data-t="C"><i class="sw" style="background:var(--C)"></i>C 寶箱</button>
<button data-t="H"><i class="sw" style="background:var(--H)"></i>H 補血點</button>
<button data-t="K"><i class="sw" style="background:var(--K)"></i>K 鑰匙</button>
<button data-t="D"><i class="sw" style="background:var(--D)"></i>D 門扉</button>
</div>
</div>

<div class="main">
<div class="card">
<div class="stat"><span id="sName"></span><span>未探索 <b id="sUnk">0</b> 格</span><span>已補 <b id="sChg">0</b> 格</span></div>
<div class="grid" id="grid"></div>
<div class="row" style="margin-top:10px"><button id="undo">復原</button><button id="reset" class="danger">這張還原成網站版本</button></div>
</div>
<div class="card">
<div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">網站原圖</h2>
<label class="ck"><input type="checkbox" id="ovl"> 把我的修改疊上去</label></div>
<div class="orig"><img id="orig" alt="死亡大迷宮探索圖樣原圖"><svg id="osvg" viewBox="0 0 13 12" preserveAspectRatio="none"></svg></div>
<p class="note" style="margin:8px 0 0">原圖用來對照位置。疊上去時，黃框是你改過的格子。</p>
</div>
</div>

<div class="card">
<h2>匯出</h2>
<div class="row"><button id="cpOne" class="on">複製這張（文字版）</button><button id="cpAll">複製全部 7 張（文字版）</button><button id="cpJson">複製備份（JSON）</button></div>
<p class="note">把文字版貼給 Claude，就能用補完的地圖算最佳路徑或更新攻略頁面。</p>
<details><summary class="note" style="cursor:pointer">匯入備份</summary><textarea id="imp" placeholder="貼上用「複製備份」得到的內容"></textarea><button id="impBtn">匯入</button></details>
</div>
<p class="note"><a href="index.html">← 回首頁</a></p>
</div>

const KEY='neko-fill-death-labyrinth-v1';
const NAME={'.':'路','#':'牆','~':'未探索',E:'入口',B:'頭目',C:'寶箱',H:'補血點',K:'鑰匙',D:'門扉'};
let st={cur:'1',maps:{}},tool='.',hist=[],painting=false,lastCell=null;
function load(){try{const s=localStorage.getItem(KEY);if(s)st=Object.assign(st,JSON.parse(s));}catch(e){}for(const k in BASE)if(!st.maps[k]||st.maps[k].length!==BASE[k].length)st.maps[k]=BASE[k].slice();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){toast('這個瀏覽器不能存檔，記得匯出備份');}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1600);}
const cls=t=>t==='.'?'f':t==='#'?'w':t==='~'?'u':t;
function unk(k){return st.maps[k].join('').split('~').length-1;}
function chg(k){let n=0;st.maps[k].forEach((r,y)=>[...r].forEach((t,x)=>{if(t!==BASE[k][y][x])n++;}));return n;}
function renderTabs(){document.getElementById('tabs').innerHTML=Object.keys(BASE).map(k=>{const u=unk(k);return `<button data-k="${k}" class="${k===st.cur?'on':''}">圖樣 ${k} <small>${u?'剩 '+u+' 格':'✓ 完整'}</small></button>`}).join('');}
function render(){renderTabs();const k=st.cur,g=st.maps[k],H=g.length,W=g[0].length;const el=document.getElementById('grid');
 el.style.gridTemplateColumns=`18px repeat(${W},minmax(0,34px))`;let h='<div></div>';for(let x=0;x<W;x++)h+=`<div class="coord">${x}</div>`;
 g.forEach((row,y)=>{h+=`<div class="coord">${y}</div>`;[...row].forEach((t,x)=>{const lab='EBCHKD'.includes(t)?t:t==='~'?'?':'';h+=`<div class="c ${cls(t)}${t!==BASE[k][y][x]?' chg':''}" data-x="${x}" data-y="${y}">${lab}</div>`;});});
 el.innerHTML=h;document.getElementById('sName').textContent='圖樣 '+k;document.getElementById('sUnk').textContent=unk(k);document.getElementById('sChg').textContent=chg(k);
 document.getElementById('orig').src=ORIG[k];
 let s='';if(document.getElementById('ovl').checked){g.forEach((row,y)=>[...row].forEach((t,x)=>{if(t!==BASE[k][y][x]){const col={'.':'rgba(141,136,163,.85)','#':'rgba(40,38,52,.9)','~':'rgba(0,0,0,.85)'}[t]||'rgba(242,193,78,.6)';s+=`<rect x="${x+.06}" y="${y+.06}" width=".88" height=".88" fill="${col}" stroke="#f2c14e" stroke-width=".08"/>`;if('EBCHKD'.includes(t))s+=`<text x="${x+.5}" y="${y+.68}" font-size=".5" text-anchor="middle" fill="#fff" font-weight="700">${t}</text>`;}}));}
 document.getElementById('osvg').innerHTML=s;}
function paint(x,y){const k=st.cur,row=st.maps[k][y];if(row[x]===tool)return;st.maps[k][y]=row.slice(0,x)+tool+row.slice(x+1);}
function begin(){hist.push(JSON.stringify(st.maps[st.cur]));if(hist.length>200)hist.shift();}
const grid=document.getElementById('grid');
grid.addEventListener('pointerdown',e=>{const c=e.target.closest('.c');if(!c)return;e.preventDefault();painting=true;begin();lastCell=null;handle(c);});
grid.addEventListener('pointermove',e=>{if(!painting)return;const t=document.elementFromPoint(e.clientX,e.clientY);const c=t&&t.closest&&t.closest('#grid .c');if(c)handle(c);});
window.addEventListener('pointerup',()=>{if(painting){painting=false;save();render();}});
function handle(c){const id=c.dataset.x+','+c.dataset.y;if(id===lastCell)return;lastCell=id;paint(+c.dataset.x,+c.dataset.y);c.className='c '+cls(tool)+(tool!==BASE[st.cur][+c.dataset.y][+c.dataset.x]?' chg':'');c.textContent='EBCHKD'.includes(tool)?tool:tool==='~'?'?':'';}
document.getElementById('tools').onclick=e=>{const b=e.target.closest('button');if(!b)return;tool=b.dataset.t;document.querySelectorAll('#tools button').forEach(x=>x.classList.toggle('on',x===b));};
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.cur=b.dataset.k;hist=[];save();render();};
document.getElementById('undo').onclick=()=>{if(!hist.length)return toast('沒有可以復原的動作');st.maps[st.cur]=JSON.parse(hist.pop());save();render();};
let arm=0;document.getElementById('reset').onclick=e=>{if(Date.now()-arm>3000){arm=Date.now();e.target.textContent='再按一次確認還原';setTimeout(()=>e.target.textContent='這張還原成網站版本',3000);return;}begin();st.maps[st.cur]=BASE[st.cur].slice();arm=0;e.target.textContent='這張還原成網站版本';save();render();toast('已還原');};
document.getElementById('ovl').onchange=render;
function txt(k){return `死亡大迷宮 圖樣 ${k}（未探索 ${unk(k)} 格）\n${st.maps[k].join('\n')}`;}
const LEG='圖例：# 牆 . 路 ~ 未探索 E 入口 B 頭目 C 寶箱 H 補血點 K 鑰匙 D 門扉\n\n';
async function copy(t,m){try{await navigator.clipboard.writeText(t);toast(m);}catch(e){const ta=document.getElementById('imp');ta.parentElement.open=true;ta.value=t;ta.select();toast('無法自動複製，已放到下方文字框');}}
document.getElementById('cpOne').onclick=()=>copy(LEG+txt(st.cur),'已複製圖樣 '+st.cur);
document.getElementById('cpAll').onclick=()=>copy(LEG+Object.keys(BASE).map(txt).join('\n\n'),'已複製全部 7 張');
document.getElementById('cpJson').onclick=()=>copy(JSON.stringify({v:1,dungeon:'death-labyrinth',maps:st.maps}),'已複製備份');
document.getElementById('impBtn').onclick=()=>{try{const o=JSON.parse(document.getElementById('imp').value);if(!o.maps)throw 0;for(const k in o.maps)if(BASE[k]&&o.maps[k].length===BASE[k].length)st.maps[k]=o.maps[k];save();render();toast('匯入完成');}catch(e){toast('格式不對');}};
load();render();
</script></body></html>
